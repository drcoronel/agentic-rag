[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pyvis>=0.3.2",
    "qdrant-client>=1.19.1",
    "watchdog>=6.0.0",
]

[project.scripts]
rag = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `src` is the package itself, not the usual src/<name>/ layout.
[tool.hatch.build.targets.wheel]
packages = ["src"]
